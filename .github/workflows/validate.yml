name: Validate game JavaScript

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, playables-sdk-audit-fixes]

permissions:
  contents: read

jobs:
  syntax:
    name: JavaScript syntax and whitespace checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check src/platform.js
          node --check src/audio.js
          node --check src/art.js
          node --check src/main.js

      - name: Check patch whitespace
        run: git diff --check
